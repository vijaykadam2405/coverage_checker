# SSH-tunnel sidecar: exposes the remote server's Postgres (5432) + MinIO (9000) on the crawler
# docker network as db-tunnel:5432 / db-tunnel:9000, tunneled over the one open port (SSH).
# The crawler's .env points DATABASE_URL / CRAWLER_MINIO_ENDPOINT at db-tunnel.
#
# Run WITH the base stack (both -f files):
#   docker compose -f docker-compose.crawler.yml -f docker-compose.tunnel.yml up -d
services:
  db-tunnel:
    image: alpine:3.20
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssh-client autossh netcat-openbsd >/dev/null
        cp /key /tmp/k && chmod 600 /tmp/k
        # Destination comes from the environment, not the source. This repo is public and a
        # committed IP + non-standard SSH port + username is a complete target triple that
        # nullifies the port obfuscation and leaves only the key as defence. It is also simply
        # wrong for anyone running their own centre. No default: an unset value must fail loudly
        # rather than quietly tunnel somewhere unexpected.
        autossh -M 0 -N \
          -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
          -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new \
          -o UserKnownHostsFile=/tmp/known_hosts \
          -i /tmp/k -p ${DATA_CENTRE_SSH_PORT:?set DATA_CENTRE_SSH_PORT in .env} \
          -L 0.0.0.0:5432:localhost:5432 \
          -L 0.0.0.0:9000:localhost:9000 \
          -L 0.0.0.0:8097:localhost:8097 \
          -L 0.0.0.0:9090:localhost:9090 \
          -L 0.0.0.0:9001:localhost:9001 \
          ${DATA_CENTRE_SSH_USER:?set DATA_CENTRE_SSH_USER in .env}@${DATA_CENTRE_HOST:?set DATA_CENTRE_HOST in .env} &
        SSH=$$!
        # ── auto-recover ────────────────────────────────────────────────────────────────────
        # autossh restarts ssh when the SERVER stops answering (ServerAlive), but not when the
        # session survives with dead forwards — and Docker does NOT restart a container for
        # failing its healthcheck, only for exiting. Without this, that state sits red forever
        # while every machine behind it silently keeps its data local. So watch the forwards and
        # exit; `restart: unless-stopped` then rebuilds the tunnel from scratch.
        # (Every variable is written $$NAME: compose interpolates this file, so a single dollar
        #  would be substituted away before sh ever sees it.)
        FAILS=0
        while :; do
          sleep 15
          if ! kill -0 $$SSH 2>/dev/null; then
            echo "[tunnel] autossh exited - restarting container"; exit 1
          fi
          # Quiet on success: nc -z reports every probe on stderr, and a line every 15s buries the
          # one line that matters when something actually breaks.
          if nc -z localhost 5432 >/dev/null 2>&1 && nc -z localhost 9000 >/dev/null 2>&1; then
            [ $$FAILS -gt 0 ] && echo "[tunnel] forwards recovered"
            FAILS=0
          else
            FAILS=$$((FAILS+1))
            echo "[tunnel] forwards not accepting ($$FAILS/4)"
            if [ $$FAILS -ge 4 ]; then
              echo "[tunnel] dead for 60s - restarting container"
              kill $$SSH 2>/dev/null; exit 1
            fi
          fi
        done
    volumes:
      - ./secrets/mallory_deploy:/key:ro
    # Also publish to the HOST (localhost only) so a native app / DB GUI can reach the server's
    # Postgres (databases: mallory, l2) and MinIO through the tunnel.
    ports:
      - "127.0.0.1:15432:5432"   # localhost:15432 -> server Postgres
      - "127.0.0.1:19000:9000"   # localhost:19000 -> server MinIO S3
      # The crawler's own dashboard, now that the crawler runs ON the centre. The hosting provider
      # drops inbound traffic to every port except SSH, so a raw IP:port never answers however the
      # service is bound — this forward is how you reach it:  http://localhost:8090/
      # Server-side it listens on 8091, because 8090 belongs to a co-tenant that was there first.
      - "127.0.0.1:8090:8091"    # localhost:8090  -> the crawler dashboard on the centre
      # The ingest service's own live page: corpus counts, per-source rows and the recent-
      # documents tail, read straight from Postgres + MinIO rather than via the orchestrator.
      # 9091/9011, not 9090/9001: the LOCAL dev stack already publishes those for its own ingest
      # and MinIO, and binding them here fails the whole tunnel container on startup.
      - "127.0.0.1:9091:9090"    # localhost:9091  -> data-centre ingest API + /live
      # MinIO's web console (browse buckets, objects, sizes). It listens on :9001 INSIDE the
      # minio container and is NOT published by the mallory-data stack, which holds the corpus
      # and is not ours to recreate for a dashboard. A separate socat container on that network
      # publishes it to the server's loopback instead:
      #   docker run -d --name mallory-minio-console --restart unless-stopped \
      #     --network mallory-data_default -p 127.0.0.1:9001:9001 \
      #     alpine/socat tcp-listen:9001,fork,reuseaddr tcp-connect:mallory-data-minio-1:9001
      - "127.0.0.1:9011:9001"    # localhost:9011  -> data-centre MinIO console
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5432 && nc -z localhost 9000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # The two services that talk to Postgres/MinIO wait for the tunnel to be up.
  ingest:
    depends_on:
      db-tunnel:
        condition: service_healthy

  crawler-api:
    depends_on:
      db-tunnel:
        condition: service_healthy

  # The dashboard's data-centre status probe reaches the server through this tunnel too.
  orchestrator:
    depends_on:
      db-tunnel:
        condition: service_healthy
