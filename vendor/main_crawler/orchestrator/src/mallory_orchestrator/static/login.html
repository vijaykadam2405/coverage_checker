<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mallory — sign in</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#232b36; --ink:#e6edf3; --dim:#8b98a5;
    --accent:#3d8bfd; --bad:#f85149; --ok:#3fb950;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
       color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .card{width:min(92vw,400px);background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:28px}
  h1{margin:0 0 4px;font-size:19px;letter-spacing:.2px}
  .sub{margin:0 0 22px;color:var(--dim);font-size:13px}
  label{display:block;font-size:12px;color:var(--dim);margin:14px 0 5px;
        text-transform:uppercase;letter-spacing:.6px}
  input{width:100%;padding:10px 12px;background:#0d1117;border:1px solid var(--line);
        border-radius:7px;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  #code{letter-spacing:.5em;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}
  button{width:100%;margin-top:20px;padding:11px;background:var(--accent);border:0;
         border-radius:7px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;
         font-family:inherit}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:14px;font-size:13px;min-height:1.2em}
  .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)} .msg.dim{color:var(--dim)}
  .back{margin-top:14px;text-align:center}
  .back a{color:var(--dim);font-size:12px;cursor:pointer;text-decoration:underline}
  .hide{display:none}
</style>

<form class="card" id="card" autocomplete="on">
  <h1>Mallory</h1>
  <p class="sub">Acquisition orchestrator</p>

  <div id="step1">
    <label for="u">User id</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Continue</button>
  </div>

  <div id="step2" class="hide">
    <label for="code">Six-digit code</label>
    <!-- inputmode=numeric gets the number pad on a phone without rejecting a paste on desktop -->
    <input id="code" name="one-time-code" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" pattern="[0-9]{6}">
    <button id="go2" type="submit">Sign in</button>
    <div class="back"><a id="restart">Use a different account</a></div>
  </div>

  <div class="msg dim" id="msg"></div>
</form>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let challenge = null;

  const say = (t, cls = "dim") => { $("msg").textContent = t; $("msg").className = "msg " + cls; };

  async function post(url, body) {
    const r = await fetch(url, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body), credentials: "same-origin",
    });
    let data = {};
    try { data = await r.json(); } catch { /* a proxy error page is not JSON */ }
    if (!r.ok) throw new Error(data.detail || `${r.status} ${r.statusText}`);
    return data;
  }

  function step(n) {
    $("step1").classList.toggle("hide", n !== 1);
    $("step2").classList.toggle("hide", n !== 2);
    if (n === 2) $("code").focus(); else $("u").focus();
  }

  $("card").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = challenge ? $("go2") : $("go");
    btn.disabled = true;
    try {
      if (!challenge) {
        say("Checking…");
        const d = await post("/api/auth/login", {username: $("u").value, password: $("p").value});
        challenge = d.challenge;
        step(2);
        say(`Code sent to ${d.sent_to.join(" and ")}. It expires in `
            + `${Math.round(d.expires_in_s / 60)} minutes.`, "ok");
      } else {
        say("Verifying…");
        await post("/api/auth/verify", {challenge, code: $("code").value});
        say("Signed in. Loading…", "ok");
        // replace(), not href: the login page must not sit in history behind the dashboard, or
        // Back lands on a form that now silently redirects and looks broken.
        location.replace("/");
      }
    } catch (err) {
      say(err.message, "bad");
      // A dead challenge cannot be retried — send them back rather than letting them type into a
      // code box that will never accept anything.
      if (challenge && /expired|Start again/i.test(err.message)) { challenge = null; step(1); }
    } finally {
      btn.disabled = false;
    }
  });

  $("restart").addEventListener("click", () => {
    challenge = null; $("code").value = ""; $("p").value = ""; step(1); say("");
  });
})();
</script>
