name: secret-scan
# Fails the build if an infrastructure address, SSH target, or private key is ever committed.
# This repo is public — a committed IP + user + port is a complete attack target, so this guard
# keeps the scrub from silently regressing. Real credentials live only in an untracked .env.
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for leaked infra addresses / SSH targets / keys
        run: |
          pat='103\.126\.197\.150|187\.127\.134\.12|-p 45632|sysadmin@|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
          # Exclude this workflow file (it necessarily contains the patterns) and the git dir.
          if grep -rnE "$pat" --exclude-dir=.git --exclude=secret-scan.yml . ; then
            echo "::error::A leaked infra address, SSH target, or private key was committed (matches above). Scrub it before merging."
            exit 1
          fi
          echo "Clean — no leaked addresses, SSH targets, or keys found."
